name: Build PCL2
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Find solution
        id: sln
        shell: bash
        run: echo "path=$(find . -name '*.sln' | head -n 1)" >> $GITHUB_OUTPUT

      - name: Restore packages
        run: nuget restore "${{ steps.sln.outputs.path }}"

      - name: Build
        run: msbuild "${{ steps.sln.outputs.path }}" /p:Configuration=Release

      - uses: actions/upload-artifact@v4
        with:
          name: PCL2-build
          path: |
            **/bin/Release/**
